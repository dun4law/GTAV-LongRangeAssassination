[General]
; Release remote focus when a target is found, or after 8 seconds per stage.
; Prioritizes nearby scenery; remote target/collision persistence needs in-game testing.
PlayerPriorityStreaming=true
; Automatically lock valid targets in range. Toggle the tool OFF/ON after changing.
; When true, the manual Lock key only shows an Auto lock ON reminder.
AutoLock=false
; Mission spawn distance in metres including altitude difference (500-10000).
RangeMetres=5000
; Independent acquisition/retention distance for the custom lock (500-10000 metres).
; General settings take effect after toggling the tool OFF and ON.
; A larger lock range does not spawn missing targets or extend missile lifetime.
LockRangeMetres=5000
; Moves the streaming focus to the mission target. Ctrl+F8 toggles while running.
RemoteStreaming=true
; Prevents this mission's distance/visibility helper from counting a remote target as escaped.
PreventDistanceEscape=true
; Warn (and log) when map buildings/terrain lie on the straight line to the locked target.
; Warning only: it cannot unblock the path. Toggle the tool OFF/ON after changing.
PathCheck=true
; Show a yellow map blip at the suggested open approach point while the path is blocked.
ApproachMarker=true

[Hotkeys]
; Examples: Ctrl+F10, F6, Alt+L, Ctrl+Shift+K. Use different keys for each action.
; UI and hotkey changes reload automatically within about 1 second after saving.
Toggle=Ctrl+F10
Lock=Ctrl+L
Streaming=Ctrl+F8

[Display]
; Hide the constant LRT status/distance message. Keep the target box visible.
ShowStatusText=false
; Distance is shown only when ShowStatusText is also true.
ShowDistance=false
ShowTargetBox=true
; Small label under the target box: state (TARGET / LOCKED / LOCKED - PATH BLOCKED) and distance.
ShowTargetLabel=true
; Top-centre countdown to the nearest assigned missile's estimated impact (an estimate only).
ShowImpactTimer=true
; Short bottom messages: ON, OFF, LOCKED, UNLOCKED, No target, etc.
ShowBottomMessages=true
MessageDurationMs=1800
; Bottom message colour: Yellow, Red, or Custom. Changes reload after saving.
BottomTextColor=Yellow
BottomTextAlpha=235
; Used only when BottomTextColor=Custom. Each value is 0-255.
BottomTextRed=255
BottomTextGreen=220
BottomTextBlue=80
; Status text colour. Each value is 0-255.
; White: 255,255,255. Green: 80,255,120. Yellow: 255,220,80.
TextRed=255
TextGreen=255
TextBlue=255
; 0 = invisible; 255 = fully opaque.
TextAlpha=235
